replicaCount: 1

image:
  repository: CHANGE_ME_registry/kube-app
  tag: latest
  pullPolicy: IfNotPresent

nodeSelector: {}
# Exemple : kube12/node: kube-1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: traefik
  # Domaine construit sur une variable, voir README racine du repo kube-infra
  host: kube-app.127.0.0.1.sslip.io

persistence:
  enabled: false
  storageClassName: efs-sc
  size: 1Gi

# Configuration applicative (issue de docker-compose.yaml)
# Non sensible -> ConfigMap, sensible -> Secret (voir Sealed Secrets, ticket à venir)
config:
  appEnv: dev
  appDebug: "true"
  dbConnection: mysql
  dbHost: CHANGE_ME_db_service_name
  dbPort: "3306"
  dbDatabase: app_database
  dbUsername: app_user

# Nom du Secret scellé fournissant APP_KEY et DB_PASSWORD
# Clés attendues dans le secret : APP_KEY, DB_PASSWORD
secretName: kube-app-secrets
